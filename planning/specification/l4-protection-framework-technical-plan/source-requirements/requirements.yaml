  title: Atomic generation
- id: AC-006
  title: Safe retirement
- id: AC-007
  title: Source independence
- id: AC-008
  title: Exporter isolation
- id: AC-009
  title: Event overflow
- id: AC-010
  title: Packet lifetime
- id: AC-011
  title: Update rollback
- id: AC-012
  title: Resource rejection
